{% extends "base.html" %}

{% block content %}
<h1 class="text-2xl font-bold text-center mb-6">Survei Kepuasan Masyarakat (SKM)</h1>
<form method="POST" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
  {% for unsur in unsur_pelayanan %}
  <div class="mb-4">
    <label class="block text-gray-700 text-sm font-bold mb-2">{{ loop.index }}. {{ unsur }}</label>
    <div class="space-y-2">
      <div class="flex items-center">
        <input type="radio" name="nilai_{{ loop.index0 }}" value="1" required id="nilai_{{ loop.index0 }}_1" class="mr-2">
        <label for="nilai_{{ loop.index0 }}_1" class="text-gray-700">Tidak Mudah</label>
      </div>
      <div class="flex items-center">
        <input type="radio" name="nilai_{{ loop.index0 }}" value="2" id="nilai_{{ loop.index0 }}_2" class="mr-2">
        <label for="nilai_{{ loop.index0 }}_2" class="text-gray-700">Cukup Mudah</label>
      </div>
      <div class="flex items-center">
        <input type="radio" name="nilai_{{ loop.index0 }}" value="3" id="nilai_{{ loop.index0 }}_3" class="mr-2">
        <label for="nilai_{{ loop.index0 }}_3" class="text-gray-700">Mudah</label>
      </div>
    </div>
  </div>
  {% endfor %}
  <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
    Hitung SKM
  </button>
</form>
{% endblock %}
